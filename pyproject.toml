[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-factory"
version = "0.1.0"
description = "Modular multi-agent YouTube content factory for tech, AI, robotics, and science"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Content Factory" }]
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "arxiv>=2.1.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "tenacity>=8.3.0",
  "duckduckgo-search>=6.0.0",
  "edge-tts>=6.1.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-mock>=3.14.0",
]

[project.scripts]
content-factory = "content_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
