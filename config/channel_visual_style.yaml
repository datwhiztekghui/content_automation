# Competitive visual DNA — peer bar: AI Revolution / high-retention tech news
# Reference look: cinematic 3D CGI hero (robot/AI), server halls, holograms,
# BOLD burned-in titles + company branding (ByteDance-style). Only ban AI watermarks.

channel_name: "Tech Frontier"
peer_references:
  - name: "AI Revolution–class tech news"
    example_url: "https://www.youtube.com/watch?v=MEw7TrAUEPQ"
    traits:
      - rapid visual change (every 2–5s on hooks; 4–7s mid-roll)
      - cinematic 3D CGI / premium AI-commercial look (robot, holograms, data centers)
      - company logos ON the image when the story is about that company
      - bold burned-in headline text for the one claim of the shot
      - CEO / public-figure photos when they drive the news
      - kinetic numbers and comparison energy
      - dark blue cyan grade, high contrast thumbnails

brand_grade:
  background: "near-black / deep navy / server-room blue"
  accent_primary: "electric cyan / neon blue"
  accent_secondary: "amber / hot white for main title"
  type: "massive bold sans, 2–6 words primary claim, smaller subline"
  motion: "snap zooms, hologram flickers, light streaks"

# Image generation prompt law (Grok Imagine / Gemini / Midjourney)
image_prompt_rules:
  must_include_when_relevant:
    - company logo or brand signage (Meta, OpenAI, ByteDance, NVIDIA, etc.)
    - bold English on-image title for the shot’s main claim
    - optional Chinese/local brand lettering if that market is the story
    - holographic UI / neural graphs / robot or agent hero when fitting
  must_exclude:
    - AI generator watermarks (Midjourney/Gemini/Grok stamp, stock watermark)
    - muddy unreadable logo approximations (prefer sharp official-looking mark)
  style_lock: |
    Ultra-detailed cinematic 3D CGI, Unreal Engine 5 look, volumetric blue light,
    reflective chrome and matte white robot surfaces when a humanoid is used,
    dense server racks with RGB LEDs and cable rainbows, floating holographic
    panels with neural network diagrams, dramatic rim light, shallow DOF,
    YouTube 16:9 thumbnail-ready composition, left or right hero, opposite side
    for giant typography. Photoreal materials, not flat cartoon.

thumbnail_system:
  formula: "HERO (robot/CEO/product) + LOGO + 2–6 WORD MEGA TEXT + high contrast"
  rules:
    - Giant title readable at phone size
    - Company logo clearly visible
    - One primary claim only
    - Dark tech background, cyan/amber accents
    - Face or robot looking toward text block when possible

must_have_asset_classes:
  - kinetic_stat
  - comparison_card
  - ui_screen
  - logo_card
  - person_plate
  - cinematic_broll
  - news_headline
  - geo_map
  - timeline
  - proof_quote
  - end_brand

identity_and_brands:
  policy: |
    Product/company news must SHOW logos and relevant public figures.
    Logos and burned-in claim text belong ON key frames (thumb + cold open +
    major beats). Only AI-service watermarks are forbidden.
  logo_sources:
    - official press kit / brand resources
    - sharp on-image logo in CGI shots
    - newsroom assets
  person_photo_sources:
    - official portraits / news stills
    - reference-first edits from real photos

banned_as_primary_visual:
  - empty rooms with no story graphics
  - soft documentary stills with zero type or brand
  - name-only cards when logo/face should appear
  - AI generator watermarks

free_tier:
  stills: "Gemini / Grok Imagine / equivalent — cinematic CGI style lock"
  identity: "Capture real portraits + render sharp logos in-frame"
  text_on_image: "Burn main claim text into hero frames; CapCut for extra captions"
  real_proof: "Screenshot official pages when numbers need source credibility"

hook_recipe:
  cut_interval_sec: [2, 4]
  pattern:
    - mega_title_logo_hero
    - logo_card_or_ceo_portrait
    - cinematic_cgi_broll
    - product_ui_or_hologram
    - kinetic_stat_reinforce
