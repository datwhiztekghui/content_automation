# Competitive visual DNA — peer bar: AI Revolution / high-retention tech news
# Product/news stories MUST show real companies, logos, and public figures (captured, not invented).

channel_name: "Tech Frontier"
peer_references:
  - name: "AI Revolution–class tech news"
    example_url: "https://www.youtube.com/watch?v=MEw7TrAUEPQ"
    traits:
      - rapid visual change (every 2–5s on hooks; 4–7s mid-roll)
      - kinetic typography for numbers and claims
      - REAL company logos on screen (clean capture / official assets)
      - REAL CEO / public-figure photos when the person is part of the story
      - product UI demos and screen captures of REAL sources
      - cinematic tech B-roll as energy between proof shots
      - high-contrast thumbnails: face OR product + huge text + emotion
      - dark grade, cyan/magenta energy accents

brand_grade:
  background: "near-black / deep navy"
  accent_primary: "electric cyan"
  accent_secondary: "hot magenta / amber for warnings"
  type: "bold geometric sans, massive numbers"
  motion: "snap zooms, whip pans on stills, count-up numbers, glitch accents sparingly"

must_have_asset_classes:
  - kinetic_stat
  - comparison_card
  - ui_screen              # real product / news article screenshots
  - logo_card              # official company logos (captured)
  - person_plate           # real photo of CEO/judge/AG/founder (captured)
  - cinematic_broll
  - news_headline
  - geo_map
  - timeline
  - proof_quote            # quote + real portrait when speaker is named
  - end_brand

# Identity & brand capture policy (news authenticity)
identity_and_brands:
  policy: |
    When a company, product, CEO, celebrity, or public figure is central to the news,
    the audience must SEE them — not only read their name on a lower-third.
    Capture real assets. Do not invent photoreal faces from imagination alone.
  logo_sources:
    - official press kit / brand resources
    - company About / Newsroom pages
    - Wikipedia / Wikimedia Commons (when licensed)
    - high-res freeze from official YouTube keynotes (fair-use commentary)
  person_photo_sources:
    - official portraits / newsroom headshots
    - Reuters / AP / Getty / outlet stills (respect license)
    - Wikimedia Commons portraits when available
    - reference-first AI edit ONLY when a real reference image is available
  never:
    - pure text nameplate with zero logo/face for a product/CEO story
    - invented deepfake faces with no reference photo
    - mushy AI-guessed logos
  fair_use_note: "Commentary/criticism news explainers; prefer official assets; credit sources on screen."

# Thumbnail design (subscriber CTR)
thumbnail_system:
  formula: "FACE or PRODUCT hero + EMOTION + 2–5 WORD TEXT + HIGH CONTRAST"
  rules:
    - One clear subject (CEO face, product device, or dramatic logo moment)
    - Face when a public figure drives the story (Zuckerberg, Altman, etc.)
    - Giant readable CapCut text (2–5 words max) — never rely on AI text
    - Dark background, rim light, pop color accent
    - Curiosity gap without lying about the video
    - Avoid clutter; leave negative space for type
  layouts:
    - face_left_text_right
    - product_center_text_banner
    - logo_vs_logo_split
    - face_plus_big_number

banned_as_primary_visual:
  - empty courtrooms with no story graphics
  - random server rooms disconnected from the claim
  - generic phone scrolling as 40% of runtime
  - name-only cards when a real logo/portrait exists and should be shown
  - AI-invented faces without a real reference capture
  - illegible mush logos

free_tier:
  stills: "Grok Imagine for cinematic energy only"
  identity: "Capture real logos + portraits via search/download/screenshot pipeline"
  motion: "CapCut keyframes + free templates"
  text_and_charts: "ALWAYS CapCut"
  real_proof: "Screenshot official blogs, news, court PDFs, product pages"

hook_recipe:
  cut_interval_sec: [2, 4]
  pattern:
    - kinetic_stat_cold_open
    - logo_card_or_ceo_portrait
    - cinematic_shock_broll
    - product_ui_screen
    - kinetic_stat_reinforce
